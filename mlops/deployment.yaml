apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-translator-deployment
  labels:
    app: webhook-translator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webhook-translator
  template:
    metadata:
      labels:
        app: webhook-translator
    spec:
      containers:
      - name: translator-container
        image: webhook-translator:v1
        # Critical: Tell K8s to use the local image we loaded into Minikube
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        
        # 1. Resource Limits (Defends against memory leaks/hogging)
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        
        # 2. Secret Injection (Maps K8s Secret to Environment Variable)
        env:
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: gemini-secret
              key: api-key
              
        # 3. Liveness Probe (Checks if container has crashed/deadlocked)
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
          
        # 4. Readiness Probe (Checks if container is ready to accept traffic)
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: webhook-translator-service
spec:
  type: NodePort
  selector:
    app: webhook-translator
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30080
